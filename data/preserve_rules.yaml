# ---- NHÓM D: Chuyển đổi theo quy ước (AI làm, chương trình kiểm tra một phần)
conventions:
  - "Figure n → Hình n; Table n → Bảng n; Chapter n → Chương n; Box n → Khung n; Section → Mục; Appendix → Phụ lục."
  - "Số hiệu chương/mục/hình/bảng giữ dấu chấm như bản gốc: Figure 3.1 → Hình 3.1; Section 2.4.1 → Mục 2.4.1 (không đổi thành dấu phẩy)."
  - "et al. → và cs. ; e.g. → ví dụ ; i.e. → tức là ; vs. → so với ; approx. → khoảng."
  - "Số thập phân dùng dấu phẩy (0,5 mg), phân cách hàng nghìn dùng dấu chấm (1.000) khi number_format = vi. KHÔNG được làm tròn, KHÔNG đổi giá trị."
  - "Đơn vị thời gian được dịch: h → giờ, min → phút, s → giây, d → ngày, wk → tuần, mo → tháng, y/yr → năm."
  - "Khoảng giá trị: 5–10 mg giữ dấu gạch nối; '<', '>', '≤', '≥', '±' giữ nguyên ký hiệu."
  - "p < 0.05 → p < 0,05; 95% CI → KTC 95%; OR, HR, RR giữ nguyên chữ viết tắt (có thể chú thích lần đầu: tỉ số chênh (OR))."
  - "SD → ĐLC (độ lệch chuẩn) hoặc giữ SD theo bảng thuật ngữ; mean ± SD → trung bình ± ĐLC."
  - "Liều dùng: giữ nguyên cấu trúc số – đơn vị – đường dùng – tần suất. q.d./b.i.d./t.i.d./q.i.d. → 1 lần/ngày, 2 lần/ngày, 3 lần/ngày, 4 lần/ngày; PO → đường uống; IV → tiêm tĩnh mạch; IM → tiêm bắp; SC → tiêm dưới da."
  - "Tên thuốc: theo drug_name_style trong config (duoc_thu = cách viết của Dược thư Quốc gia Việt Nam, ví dụ amoxicilin, cefuroxim, adrenalin; inn = giữ nguyên INN). Biệt dược (tên thương mại ®) luôn giữ nguyên."
  - "Tên vi sinh vật, tên chi/loài: giữ nguyên tiếng Latin, in nghiêng."
  - "Tên riêng (tác giả, tạp chí, tên thử nghiệm lâm sàng như SPRINT, UKPDS), tên tổ chức viết tắt: giữ nguyên; tên tổ chức đầy đủ có tên Việt chính thức thì dịch (World Health Organization → Tổ chức Y tế Thế giới)."
  - "Thang điểm, phân loại (Glasgow, APGAR, NYHA, Child-Pugh, GOLD): giữ tên riêng, dịch phần mô tả."
  - "Danh mục tài liệu tham khảo (References/Bibliography): giữ nguyên toàn bộ, chỉ dịch tiêu đề mục."
