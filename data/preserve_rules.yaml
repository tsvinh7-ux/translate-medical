# ===================================================================
#  NGUYÊN TẮC GIỮ NGUYÊN / CHUYỂN ĐỔI khi dịch y khoa Anh → Việt
#  File này được chương trình đọc trực tiếp: vừa đưa vào prompt cho AI,
#  vừa dùng để KIỂM TRA TỰ ĐỘNG sau khi dịch.
#  Bạn có thể sửa / thêm quy tắc. Giải thích chi tiết: docs/NGUYEN_TAC_GIU_NGUYEN.md
# ===================================================================

# ---- NHÓM A: Thay bằng mã giữ chỗ ⟦n⟧ trước khi gửi AI, khôi phục nguyên văn sau khi dịch
#      (AI không thể làm sai vì không nhìn thấy nội dung)
protect:
  - name: url
    pattern: '(?:https?://|www\.)[^\s<>()\[\]]+[^\s<>()\[\].,;:]'
  - name: email
    pattern: '[\w.+-]+@[\w-]+\.[\w.-]+'
  - name: doi
    pattern: '\b(?:doi:\s*|https?://doi\.org/)?10\.\d{4,9}/[^\s]+[^\s.,;]'
  - name: isbn_pmid_nct
    pattern: '\b(?:ISBN(?:-1[03])?:?\s*[\d\-X ]{10,17}|PMID:?\s*\d{5,9}|PMCID:?\s*PMC\d+|NCT\d{8})\b'

# ---- NHÓM B: AI phải giữ NGUYÊN VĂN trong bản dịch (được kiểm tra tự động sau dịch)
must_keep:
  - name: acronym
    description: Chữ viết tắt in hoa (ECG, MRI, COPD, HIV). Lần đầu có thể ghi kèm nghĩa tiếng Việt.
    pattern: '\b[A-Z][A-Z0-9]{1,}(?:-[A-Z0-9]+)*s?\b'
  - name: gene_lab_symbol
    description: Ký hiệu gen, protein, xét nghiệm, dấu ấn (BRCA1, HbA1c, CD4+, HER2, IL-6, TNF-α)
    pattern: '\b(?=[A-Za-z0-9\-]*\d)(?=[A-Za-z0-9\-]*[A-Z])[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9α-ω]+)*[+\-]?(?![\w])'
  - name: tnm_stage
    description: Phân loại TNM (T2N0M0, pT1a)
    pattern: '\b[pcy]?T[0-4isx][a-d]?N[0-3x][a-c]?M[01x][a-c]?\b'
  - name: icd_code
    description: Mã ICD-10 / ATC
    pattern: '\b[A-TV-Z]\d{2}(?:\.\d{1,2})\b'
  - name: citation
    description: Trích dẫn tài liệu tham khảo dạng [12], [3-5], [1,4]
    pattern: '\[\d+(?:\s*[-–,]\s*\d+)*\]'
  - name: chemical
    description: Công thức hoá học (NaHCO3, CO2, Ca2+, H2O2)
    pattern: '\b(?:[A-Z][a-z]?\d*){2,}[+\-]?(?![\w])'
  - name: gene_italic_species
    description: Tên khoa học sinh vật (Staphylococcus aureus) – kiểm tra theo chữ nghiêng trong PDF
    pattern: '\b[A-Z][a-z]+ (?:[a-z]+)\b'
    only_italic: true

# Chữ viết tắt KHÔNG cần giữ nguyên (sẽ dịch) – tránh báo lỗi giả
