key: anesthesiology
name_vi: Gây mê hồi sức
aliases: [anesthesia, anaesthesia, gay_me, gay_me_hoi_suc, gmhs]
parents: [general_medicine]
style: |
  - Phân biệt "gây mê" (mất ý thức toàn thân) và "gây tê" (vùng/tại chỗ) – không dùng lẫn.
  - Thang điểm, phân loại (ASA, Mallampati, Aldrete, Cormack–Lehane) giữ tên gốc; nhóm phân loại giữ ký hiệu (ASA III, Mallampati độ II).
  - Liều tính theo cân nặng giữ nguyên đơn vị (mg/kg, µg/kg/phút); tốc độ truyền, nồng độ (MAC, %) giữ nguyên ký hiệu.
judge_focus: |
  - Liều, đơn vị, tốc độ truyền, đường dùng, thời điểm (khởi mê/duy trì/thoát mê), ngưỡng huyết động, chống chỉ định.
  - Gây mê vs gây tê; tên thuốc giãn cơ, thuốc hóa giải; xử trí biến cố (đặt nội khí quản khó, sốc phản vệ, tăng thân nhiệt ác tính).
terms:
