  - {en: epidural anesthesia, vi: gây tê ngoài màng cứng}
  - {en: peripheral nerve block, vi: gây tê thần kinh ngoại vi}
  - {en: induction of anesthesia, vi: khởi mê}
  - {en: emergence from anesthesia, vi: thoát mê}
  - {en: endotracheal intubation, vi: đặt nội khí quản}
  - {en: difficult airway, vi: đường thở khó}
  - {en: laryngeal mask airway, vi: mặt nạ thanh quản}
  - {en: neuromuscular blocking agent, vi: thuốc giãn cơ}
  - {en: rapid sequence induction, vi: khởi mê nhanh}
  - {en: minimum alveolar concentration, vi: nồng độ phế nang tối thiểu}
  - {en: malignant hyperthermia, vi: tăng thân nhiệt ác tính}
