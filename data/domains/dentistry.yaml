key: dentistry
name_vi: Nha khoa – Răng Hàm Mặt
aliases: [dental, nha_khoa, rang_ham_mat, rhm, odontology]
parents: [general_medicine]
style: |
  - Dùng thuật ngữ Răng Hàm Mặt Việt Nam; phân biệt nghĩa giải phẫu và phục hình (crown: "thân răng" khi giải phẫu, "mão răng/chụp răng" khi phục hình).
  - Ký hiệu răng (FDI 11–48, Universal 1–32, Palmer) GIỮ NGUYÊN như bản gốc, không quy đổi hệ ký hiệu.
  - Tên vật liệu, hệ thống implant, tên thương mại khí cụ giữ nguyên.
judge_focus: |
  - Đúng răng, đúng mặt răng (mesial/distal/buccal/lingual/occlusal), đúng hàm (trên/dưới), đúng phía (phải/trái).
  - Thuật ngữ giải phẫu – phục hình không lẫn nhau; chỉ định/chống chỉ định thủ thuật, liều thuốc tê.
