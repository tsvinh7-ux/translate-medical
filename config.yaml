# ============================================================
#  Cấu hình MedTrans - công cụ dịch tài liệu y khoa Anh → Việt
# ============================================================

llm:
  provider: anthropic          # anthropic (API Claude) | local (model chạy trên máy) | medcrab | mock (chạy thử)
  model: claude-opus-5-5       # model mạnh nhất cho chất lượng cao
  effort: xhigh                # low | medium | high | xhigh | max  (chế độ khắt khe: xhigh; tối đa: max)
  review_effort: xhigh         # mức suy luận cho hiệu đính / biên tập / giám khảo
  max_tokens: 64000
  use_fallbacks: true          # tự chuyển model dự phòng nếu bị từ chối
  max_retries: 4
  timeout_seconds: 900
  routes: {}                   # định tuyến công đoạn → backend, vd {translate: medcrab} hoặc {translate: local}
                               # công đoạn: brief, termprep, translate, refine, revise, review, evaluate, fidelity,
                               # consistency, research, proof, ocr_fix, extract_terms, validate_terms
  local:                       # MODEL LOCAL qua API chuẩn OpenAI: Ollama / llama.cpp / vLLM / LM Studio
    base_url: http://localhost:11434/v1     # Ollama mặc định; vLLM: http://localhost:8000/v1
    model: qwen3:32b                        # model đủ mạnh cho hiệu đính/giám khảo (khuyến nghị ≥ 32B)
    json_mode: json_schema                  # json_schema (vLLM, llama.cpp, LM Studio, Ollama mới) | ollama | json_object
    vision_model: ""                        # vd qwen2.5vl:32b – để đọc morat bằng hình ảnh khi chạy local
    temperature: 0.1
    max_tokens: 16000
    timeout_seconds: 1800
    throughput_tokens_per_sec: 60           # tốc độ sinh tổng (dùng để dự báo thời gian) – đo lại trên máy bạn
  local_judge:                 # GIÁM KHẢO LOCAL THỨ HAI – nên KHÁC HỌ với model dịch (dịch Qwen → chấm Gemma)
    base_url: http://localhost:11434/v1     # để model không tự chấm bài của chính mình (lỗi trùng nhau)
    model: gemma4:31b                       # kiểm tra tag mới nhất: `ollama list` / python -m medtrans local-check
    json_mode: json_schema
    temperature: 0.0
    max_tokens: 16000
    timeout_seconds: 1800
    throughput_tokens_per_sec: 35
  medcrab:                     # MedCrab-1.5B (Qwen2.5-1.5B tinh chỉnh Anh→Việt y khoa) – CHỈ làm bước dịch
    engine: completions                     # completions (vLLM/llama.cpp phục vụ model) | transformers (nạp trực tiếp)
    base_url: http://localhost:8001/v1
    model: pnnbao-ump/MedCrab-1.5B
    throughput_tokens_per_sec: 400
    # GIẤY PHÉP: CC BY-NC 4.0 – dùng cho mục đích thương mại phải có sự cho phép của tác giả

  # ---------------- DỰ PHÒNG ĐA NHÀ CUNG CẤP (chuẩn bị giai đoạn kế tiếp – mặc định TẮT, bản hiện tại chạy 1 mô thức chuẩn)
  failover: []                 # thứ tự dự phòng khi nhà cung cấp chính lỗi/quá tải, vd [openai, local]
  providers:                   # mọi nhà cung cấp có API chuẩn OpenAI; khoá API đặt trong .env (api_key_env)
    openai:
      base_url: https://api.openai.com/v1
      model: ""                # điền model hiện hành (vd dòng GPT mới nhất) trước khi dùng
      api_key_env: OPENAI_API_KEY
      price_per_mtok: [0, 0]   # giá USD / 1 triệu token (đầu vào, đầu ra) để dự toán chi phí
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: ""
      api_key_env: GEMINI_API_KEY
      price_per_mtok: [0, 0]
  # KIỂM TOÁN CHÉO KHÁC HÃNG (tuỳ chọn): routes: {fidelity: openai} → model hãng khác kiểm toán bản dịch của Claude

escalation:                    # LEO THANG CÓ ĐIỀU KIỆN (dùng với model local): chỉ đoạn khó mới gọi API
  enabled: false
  backend: anthropic           # backend mạnh để sửa & kiểm định đoạn không qua cổng local
  min_score: 96                # điểm MQM local dưới ngưỡng → leo thang
  on_uncertain_terms: true     # model local báo thuật ngữ chưa chắc → leo thang
  audit_rate: 0.15             # kiểm tra mẫu ngẫu nhiên 15% đoạn local cho là đạt → đo độ tin cậy giám khảo local
  eval_rounds: 2
  certify_requires_api: true   # chỉ CHỨNG NHẬN (vào bộ nhớ dịch đạt chuẩn) đoạn đã được API xác nhận
  expected_share: 0.3          # tỉ lệ đoạn dự kiến phải leo thang (dùng để dự báo chi phí; tự đo lại khi chạy)

translation:
  source_lang: en              # ngôn ngữ nguồn (hiện hoàn thiện: en). Đích luôn là tiếng Việt
  domain: general_medicine     # chuyên ngành mặc định (cardiology, oncology, pharmacology...)
  batch_chars: 6000            # số ký tự nguồn gộp vào một lần gọi API
  workers: 6                   # số luồng song song (tăng nếu hạn mức API cho phép)
  number_format: vi            # vi = 0,5 mg; 1.000 (chuẩn Việt) | keep = giữ nguyên như bản gốc
  drug_name_style: duoc_thu    # duoc_thu = theo Dược thư QG VN (amoxicilin) | inn = giữ INN gốc (amoxicillin)
  abbreviation_policy: first_gloss   # first_gloss = lần đầu ghi "tiếng Việt (ABBR)" | keep = giữ nguyên
  review_mode: always          # always = luôn chạy vòng biên tập 2 | on_issues = chỉ khi có lỗi
  max_refine_rounds: 3         # số vòng sửa tối đa khi kiểm tra tự động còn lỗi
  web_research: true           # tra cứu Internet khi thuật ngữ không chắc chắn
  web_research_max_uses: 5
  web_preferred_domains:       # nguồn ưu tiên khi tra cứu
    - moh.gov.vn
    - kcb.vn
    - dav.gov.vn
    - thuvienphapluat.vn
    - vinmec.com
    - bvndtp.org.vn
    - hmu.edu.vn
    - ump.edu.vn
    - who.int
    - ncbi.nlm.nih.gov
    - medlineplus.gov

workflow:                      # quy trình xuất bản (bật/tắt từng công đoạn)
  revise: true                 # HIỆU ĐÍNH chuyên môn (bác sĩ/dược sĩ đối chiếu bản gốc)
  edit: true                   # BIÊN TẬP ngôn ngữ (văn phong xuất bản)
  consistency: true            # BIÊN TẬP TOÀN VĂN (thống nhất thuật ngữ, văn phong giữa các đoạn/chương)
  consistency_chunk_chars: 20000

terminology:                   # CHUẨN BỊ THUẬT NGỮ TOÀN VĂN trước khi dịch
  prepass: true
  require_lock: false          # true = CHỐT CHẶN: quét → xuất termbase → chờ kiểm tra & khoá rồi mới dịch
  chunk_chars: 40000
  uncertain_below: 0.85        # thuật ngữ tin cậy thấp hơn / có nhiều cách dịch → tra cứu web
  research_max_terms: 150

quality:                       # CHẾ ĐỘ KHẮT KHE – đánh giá chuẩn MQM & tự chứng nhận (không cần người duyệt)
  independent_eval: true
  fidelity_audit: true         # CHẾ TÀI TRUNG THÀNH: đối chiếu từng câu đánh số – không thêm, không bớt, đúng trình tự
  judges: [clinical, linguistic]   # hội đồng 2 giám khảo độc lập: chuyên môn y khoa + ngôn ngữ xuất bản
  eval_rounds: 3               # chấm → sửa lỗi critical/major → chấm lại (tối đa 3 vòng)
  certify_score: 97            # điểm MQM tối thiểu để TỰ CHỨNG NHẬN
  strict_certify: true         # còn bất kỳ cảnh báo máy nào (thuật ngữ, ký hiệu, số thừa, độ dài...) → không chứng nhận
  term_min_evidence: 3         # số đoạn đạt chuẩn dùng nhất quán thuật ngữ trước khi kiểm định để tự duyệt
  term_min_confidence: 0.9     # độ tin cậy tối thiểu của giám khảo khi kiểm định thuật ngữ
  web_term_min_confidence: 0.9   # thuật ngữ tra web được tự duyệt khi đủ tin cậy...
  web_term_min_sources: 2        # ...và có ít nhất N nguồn (trong đó ≥1 nguồn uy tín)
  # --- VĂN PHONG & CỔNG PHÁT HÀNH (bảo chứng chất lượng – xem docs/BAO_CHUNG_CHAT_LUONG.md)
  style_check: true              # dò "văn dịch máy / văn AI" (data/style_vi.yaml) → chuyển bước biên tập sửa
  style_max_per_1000_words: 6    # mật độ dấu hiệu văn dịch máy tối đa trong toàn văn
  long_sentence_max_percent: 10  # % câu quá dài tối đa
  release_min_pass_percent: 100  # % đoạn phải qua cổng chất lượng để PHÁT HÀNH ĐƯỢC
  release_requires_lqa: false    # true = bắt buộc có kiểm định mẫu bởi chuyên gia mới phát hành

proof:                         # ĐỌC MORAT bản dàn trang
  enabled: true
  vision: true                 # Claude so ảnh trang gốc với trang dịch (chính tả, sót dịch, chồng lấn, tràn chữ)
  rounds: 2                    # đọc → sửa → dàn lại → đọc lại trang đã sửa
  dpi: 100

memory:
  db_path: workspace/medtrans.db
  tm_reuse_threshold: 100      # % khớp để dùng lại bản dịch cũ KHÔNG gọi API (100 = khớp tuyệt đối)
  tm_fuzzy_threshold: 75       # % khớp để đưa bản dịch cũ vào làm tham khảo
  tm_min_quality: 97           # chỉ tái sử dụng đoạn đã chứng nhận (điểm MQM >= ngưỡng)
  auto_enrich: true            # tự làm giàu từ điển thuật ngữ sau mỗi tài liệu

scan:                          # PDF scan (trang là ảnh)
  enabled: true                # tự nhận diện trang scan và OCR theo đoạn văn
  dpi: 300                     # độ phân giải OCR
  ocr_correct: true            # Claude đối chiếu ảnh để sửa lỗi OCR trước khi dịch (khuyến nghị)

layout:
  font_dir: auto               # auto = tự tìm font Unicode trên máy; hoặc đường dẫn thư mục font
  serif_font: auto             # ví dụ: C:/Windows/Fonts/times.ttf
  sans_font: auto              # ví dụ: C:/Windows/Fonts/arial.ttf
  min_font_scale: 0.6          # cho phép thu nhỏ chữ tối đa còn 60% khi bản Việt dài hơn
  translate_images: true
  image_ocr: tesseract         # tesseract | claude | off
  image_min_size: 120          # bỏ qua ảnh nhỏ hơn (pixel)
  keep_math_blocks: true       # giữ nguyên khối công thức toán

branding:                      # nhận diện thương hiệu cho giao diện & báo cáo (thay bằng bộ nhận diện chính thức)
  name: DMAG
  app_title: DMAG MedTrans – Dịch thuật y khoa
  primary_color: "#0B5394"     # TẠM THỜI – thay bằng mã màu chính thức của DMAG
  secondary_color: "#F4F7FB"
  text_color: "#1D1D1F"
  font: "Be Vietnam Pro"       # font giao diện (Google Fonts, hỗ trợ tiếng Việt)
  logo: assets/logo.png        # đặt file logo DMAG vào đây

queue:
  parallel_jobs: 1             # số tài liệu xử lý đồng thời (mỗi tài liệu đã chạy đa luồng bên trong)

output:
  dir: workspace/output
  bilingual_report: true       # xuất file HTML song ngữ để biên tập viên duyệt
  certificate: true            # xuất PHIẾU KIỂM ĐỊNH chất lượng (<tên>_VI_QA.html): đủ – đúng – đọc tốt – kiểm định

# ============================================================
#  HỒ SƠ CHẤT LƯỢNG / CHI PHÍ – chọn khi tạo dự án.
#  Mỗi hồ sơ ghi đè các mục ở trên. Chạy "hiệu chuẩn" (Calibrate) trên 10–20 trang mẫu để có
#  số đo thực tế: điểm MQM, xác suất đạt chuẩn (kèm khoảng tin cậy 95%), chi phí, thời gian.
# ============================================================
default_profile: premium
profiles:
  draft:
    label: "Bản thô nhanh"
    description: "Dịch thô tốc độ cao để đọc hiểu/duyệt nhanh; sau đó có thể nâng cấp lên hồ sơ cao hơn (dùng lại bản thô)."
    llm: {model: claude-haiku-5-5, effort: low, review_effort: low, use_fallbacks: false, max_retries: 8}
    translation: {workers: 32, web_research: false, max_refine_rounds: 1}
    terminology: {prepass: true}
    workflow: {revise: false, edit: false, consistency: false}
    quality: {independent_eval: false, fidelity_audit: false, strict_certify: false}
    proof: {enabled: true, vision: false}
    memory: {auto_enrich: false}
    scan: {ocr_correct: false}
  economy:
    label: "Tiết kiệm"
    description: "Sonnet, 1 vòng biên tập, 1 giám khảo, kiểm toán trung thành; đọc morat bằng máy."
    llm: {model: claude-sonnet-5-5, effort: medium, review_effort: medium}
    translation: {workers: 12, max_refine_rounds: 2}
    workflow: {revise: false, edit: true, consistency: true}
    quality: {judges: [clinical], eval_rounds: 2, certify_score: 95}
    proof: {enabled: true, vision: false}
  balanced:
    label: "Cân bằng"
    description: "Opus, hiệu đính + biên tập, 1 giám khảo, kiểm toán trung thành, đọc morat bằng hình ảnh 1 vòng."
    llm: {model: claude-opus-5-5, effort: high, review_effort: high}
    translation: {workers: 8}
    quality: {judges: [clinical], eval_rounds: 2, certify_score: 96}
    proof: {enabled: true, vision: true, rounds: 1}
  local_cascade:
    label: "Local + Claude khi cần"
    description: "Qwen chạy trên máy làm phần lớn việc (miễn phí); chỉ đoạn khó / chưa chắc / không qua cổng mới gọi Claude; tra web & đọc morat bằng Claude. Hợp với GPU 8–16 GB (vd RTX 3050 8 GB)."
    llm: {provider: local, effort: high, review_effort: high, local: {model: "qwen3:8b"},
          routes: {research: anthropic, proof: anthropic, ocr_fix: anthropic}}
    escalation: {enabled: true}
    translation: {workers: 2}
    workflow: {revise: false, edit: true, consistency: true}
    quality: {judges: [clinical], eval_rounds: 1, certify_score: 96}
    proof: {enabled: true, vision: true, rounds: 1}
  local_pro:
    label: "Local Pro – 2 model chấm chéo + Claude"
    description: "Cho máy GPU 24–32 GB trở lên: Qwen ~27B dịch, hiệu đính, biên tập; model KHÁC HỌ (Gemma ~31B) làm giám khảo & kiểm toán trung thành; Claude chỉ tra web, sửa đoạn khó, kiểm tra mẫu và đọc morat."
    llm: {provider: local, effort: high, review_effort: high, local: {model: "qwen3.6:27b"},
          routes: {evaluate: local_judge, fidelity: local_judge, research: anthropic, proof: anthropic, ocr_fix: anthropic}}
    escalation: {enabled: true, expected_share: 0.15, audit_rate: 0.1}
    translation: {workers: 3}
    workflow: {revise: true, edit: true, consistency: true}
    quality: {judges: [clinical, linguistic], eval_rounds: 2, certify_score: 96}
    proof: {enabled: true, vision: true, rounds: 1}
  local_fast:
    label: "Local – bản thô MedCrab"
    description: "Chạy hoàn toàn trên máy bằng MedCrab-1.5B: rất nhanh, không tốn phí API, không cần Internet. Chỉ là bản nháp (không hiệu đính/giám khảo). Lưu ý giấy phép phi thương mại."
    llm: {provider: medcrab}
    translation: {workers: 8, web_research: false, max_refine_rounds: 0}
    terminology: {prepass: false}
    workflow: {revise: false, edit: false, consistency: false}
    quality: {independent_eval: false, fidelity_audit: false, strict_certify: false}
    proof: {enabled: true, vision: false}
    memory: {auto_enrich: false}
    scan: {ocr_correct: false}
  local_quality:
    label: "Local – chất lượng cao"
    description: "Toàn bộ quy trình (thuật ngữ, dịch, hiệu đính, biên tập, giám khảo MQM, kiểm toán trung thành) chạy bằng model local mạnh (Qwen3-32B…) trên GPU của bạn. Không tra web; nên khoá termbase trước."
    llm: {provider: local}
    translation: {workers: 4, web_research: false}
    terminology: {require_lock: true}
    quality: {judges: [clinical], eval_rounds: 2, certify_score: 96}
    proof: {enabled: true, vision: false}
    scan: {ocr_correct: false}
  hybrid:
    label: "Lai – dịch local, kiểm định bằng Claude"
    description: "Model local dịch nháp (tiết kiệm token đầu ra), Claude Opus hiệu đính, biên tập, chấm MQM và kiểm toán trung thành – giữ cổng chất lượng của API."
    llm: {provider: anthropic, model: claude-opus-5-5, effort: high, review_effort: high, routes: {translate: local}}
    translation: {workers: 6}
    quality: {judges: [clinical], eval_rounds: 2, certify_score: 96}
    proof: {enabled: true, vision: true, rounds: 1}
  premium:
    label: "Xuất bản cao cấp"
    description: "Chế độ khắt khe đầy đủ: Opus xhigh, hiệu đính + biên tập, 2 giám khảo, 3 vòng, đọc morat 2 vòng."
    llm: {model: claude-opus-5-5, effort: xhigh, review_effort: xhigh}
